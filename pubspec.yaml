name: natura
description: natura flutter app

publish_to: 'none'

version: 1.4.23+87

environment:
  sdk: ">=3.8.0 <4.0.0"

module:
  androidX: true

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  digit_to_word: ^1.2.1
  firebase_analytics: ^12.0.4
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.0.4
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.3
  google_fonts: ^6.3.2
  google_geocoding_api: ^1.5.2
  google_maps_apis: ^4.0.0
  google_mobile_ads: ^6.0.0
  #googleapis: ^15.0.0
  #googleapis_auth: ^2.0.0
  http: ^1.6.0
  in_app_purchase: ^3.2.3
  in_app_review: ^2.0.11
  json_annotation: ^4.9.0
  link_text: ^0.2.1
  numberpicker: ^2.1.2
  package_info_plus: ^9.0.0
  page_transition: ^2.2.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  #speech_to_text:
  #  path: /ara/devel/sandbox/speech_to_text/speech_to_text
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  video_player: ^2.10.1
  wakelock_plus: ^1.4.0

  collection: ^1.19.1
dev_dependencies:
  build_runner: ^2.10.3
  flutter_launcher_icons: # using custom fork due to a bug: https://github.com/fluttercommunity/flutter_launcher_icons/pull/181
    git:
      url: https://github.com/SimonIT/flutter_launcher_icons
      ref: scaling
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.2.16
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.1

flutter_icons:
  image_path: 'assets/icons/icon.png'
  adaptive_icon_background: '#FFFFFFFF'
  adaptive_icon_foreground: 'assets/icons/icon-adaptive.png'
  adaptive_icon_foreground_scale_factor: 0.66
  android: true
  ios: true
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash.png"
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: false

flutter:

  uses-material-design: true

  assets:
    - assets/icons/icon-adaptive.png
    - assets/images/no_image.png
    - assets/images/placeholder_banners/1.png
    - assets/images/placeholder_banners/2.png
    - assets/images/placeholder_banners/3.png
    - assets/images/placeholder_banners/4.png
    - assets/images/placeholder_banners/5.png
    - assets/images/video-frame.jpg
    - assets/sounds/speech_to_text_cancel.m4r
    - assets/sounds/speech_to_text_listening.m4r
    - assets/sounds/speech_to_text_stop.m4r
    - assets/video/flag_eagle.mp4
